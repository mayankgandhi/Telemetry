name: Tests

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-macos:
    name: Test on macOS
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show toolchain versions
      run: |
        xcodebuild -version
        swift --version

    - name: Build package
      run: swift build

    - name: Run tests
      run: swift test --parallel

  test-ios:
    name: Test on iOS Simulator
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show toolchain versions
      run: |
        xcodebuild -version
        swift --version

    - name: Show build destinations
      run: xcodebuild -showdestinations -scheme Telemetry -skipPackagePluginValidation

    # `xcodebuild test` rejects a generic destination ("Tests must be run on a concrete
    # device"), and pinning a model/OS pair breaks whenever the runner image changes. Resolve
    # the newest iPhone simulator at runtime instead.
    #
    # Ask xcodebuild rather than simctl. `simctl list devices available` reports runtimes from
    # every installed Xcode, so it can name a simulator the *selected* Xcode has no SDK for -
    # which is how the build step failed while this one succeeded. `-showdestinations` lists
    # only what the selected toolchain can actually build for.
    - name: Select an iOS simulator
      id: simulator
      run: |
        destination=$(xcodebuild -showdestinations -scheme Telemetry -skipPackagePluginValidation 2>/dev/null \
          | grep -E 'platform:iOS Simulator, arch:[^,]*, id:[^,]*, OS:[^,]*, name:iPhone' \
          | sed -E 's/.*id:([^,]*), OS:([^,]*), name:(.*) \}.*/\2 \1 \3/' \
          | sort -V | tail -1)
        udid=$(printf '%s' "$destination" | awk '{print $2}')
        if [ -z "$udid" ]; then
          echo "::error::No buildable iPhone simulator destination on this runner image"
          exit 1
        fi
        echo "Using simulator: $destination"
        echo "udid=$udid" >> "$GITHUB_OUTPUT"

    - name: Build for iOS
      run: |
        xcodebuild build-for-testing \
          -scheme Telemetry \
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
          -skipPackagePluginValidation

    - name: Run iOS tests
      run: |
        xcodebuild test-without-building \
          -scheme Telemetry \
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
          -skipPackagePluginValidation

  code-coverage:
    name: Code Coverage
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show toolchain versions
      run: |
        xcodebuild -version
        swift --version

    - name: Run tests with coverage
      run: swift test --enable-code-coverage

    # Ask SwiftPM where it put things rather than hardcoding `.build/debug/...`: the build
    # layout and the test bundle name both vary by toolchain version. The previous hardcoded
    # path did not exist, and `|| true` meant CI stayed green while uploading an empty report.
    - name: Generate coverage report
      run: |
        bin_path=$(swift build --show-bin-path)
        xctest=$(find "$bin_path" -maxdepth 1 -name '*.xctest' | head -1)
        if [ -z "$xctest" ]; then
          echo "::error::No .xctest bundle found in $bin_path"
          exit 1
        fi
        # Report on this package's own sources only. Unfiltered, ~94% of the records are
        # vendored posthog-ios checkouts, which would dominate the Codecov baseline.
        xcrun llvm-cov export \
          "$xctest/Contents/MacOS/$(basename "$xctest" .xctest)" \
          -instr-profile="$bin_path/codecov/default.profdata" \
          -ignore-filename-regex='(\.build|Tests)/' \
          -format=lcov > coverage.lcov
        # llvm-cov exits 0 even when the filter matches nothing, and the upload step below is
        # best-effort, so assert the report actually has source records before trusting it.
        records=$(grep -c '^SF:' coverage.lcov || true)
        if [ "$records" -eq 0 ]; then
          echo "::error::coverage.lcov contains no source records"
          exit 1
        fi
        echo "Wrote coverage for $records source file(s)"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.lcov
        fail_ci_if_error: false
        verbose: true
      continue-on-error: true
