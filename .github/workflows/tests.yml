name: Tests

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-macos:
    name: Test on macOS
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show toolchain versions
      run: |
        xcodebuild -version
        swift --version

    - name: Build package
      run: swift build

    - name: Run tests
      run: swift test --parallel

  test-ios:
    name: Test on iOS Simulator
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show toolchain versions
      run: |
        xcodebuild -version
        swift --version

    - name: List available simulators
      run: xcrun simctl list devices available

    # `xcodebuild test` rejects a generic destination ("Tests must be run on a concrete
    # device"), and pinning a model/OS pair breaks whenever the runner image changes. Resolve
    # the newest available iPhone simulator on the image instead.
    #
    # simctl enumerates runtimes in arbitrary order, so sort on the parsed iOS version rather
    # than taking the last key - otherwise this silently picks an older runtime than available.
    - name: Select an iOS simulator
      id: simulator
      run: |
        udid=$(xcrun simctl list devices available --json | jq -r '
          [ .devices | to_entries[]
            | select(.key | test("iOS"))
            | (.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)")
                    | (.maj | tonumber) * 1000 + (.min | tonumber)) as $version
            | .value[] | select(.name | startswith("iPhone")) | {version: $version, udid}
          ] | sort_by(.version) | last | .udid // empty')
        if [ -z "$udid" ] || [ "$udid" = "null" ]; then
          echo "::error::No available iPhone simulator on this runner image"
          exit 1
        fi
        echo "Using simulator $udid"
        echo "udid=$udid" >> "$GITHUB_OUTPUT"

    - name: Build for iOS
      run: |
        xcodebuild build-for-testing \
          -scheme Telemetry \
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
          -skipPackagePluginValidation

    - name: Run iOS tests
      run: |
        xcodebuild test-without-building \
          -scheme Telemetry \
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
          -skipPackagePluginValidation

  code-coverage:
    name: Code Coverage
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show toolchain versions
      run: |
        xcodebuild -version
        swift --version

    - name: Run tests with coverage
      run: swift test --enable-code-coverage

    # Ask SwiftPM where it put things rather than hardcoding `.build/debug/...`: the build
    # layout and the test bundle name both vary by toolchain version. The previous hardcoded
    # path did not exist, and `|| true` meant CI stayed green while uploading an empty report.
    - name: Generate coverage report
      run: |
        bin_path=$(swift build --show-bin-path)
        xctest=$(find "$bin_path" -maxdepth 1 -name '*.xctest' | head -1)
        if [ -z "$xctest" ]; then
          echo "::error::No .xctest bundle found in $bin_path"
          exit 1
        fi
        # Report on this package's own sources only. Unfiltered, ~94% of the records are
        # vendored posthog-ios checkouts, which would dominate the Codecov baseline.
        xcrun llvm-cov export \
          "$xctest/Contents/MacOS/$(basename "$xctest" .xctest)" \
          -instr-profile="$bin_path/codecov/default.profdata" \
          -ignore-filename-regex='(\.build|Tests)/' \
          -format=lcov > coverage.lcov
        # llvm-cov exits 0 even when the filter matches nothing, and the upload step below is
        # best-effort, so assert the report actually has source records before trusting it.
        records=$(grep -c '^SF:' coverage.lcov || true)
        if [ "$records" -eq 0 ]; then
          echo "::error::coverage.lcov contains no source records"
          exit 1
        fi
        echo "Wrote coverage for $records source file(s)"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.lcov
        fail_ci_if_error: false
        verbose: true
      continue-on-error: true
